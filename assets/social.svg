<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="SenjuWoo — Skyrim SE/AE, SKSE C++, agent workbenches">
  <title>SenjuWoo — social card</title>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060205"/>
      <stop offset="0.55" stop-color="#11060B"/>
      <stop offset="1" stop-color="#1A0710"/>
    </linearGradient>
    <linearGradient id="sname" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF8F1"/>
      <stop offset="0.58" stop-color="#F3D9C9"/>
      <stop offset="0.655" stop-color="#C9283F"/>
      <stop offset="0.735" stop-color="#D8314B"/>
      <stop offset="0.855" stop-color="#FFB627"/>
      <stop offset="1" stop-color="#FFD98A"/>
    </linearGradient>
    <linearGradient id="srule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB627" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFB627"/>
      <stop offset="0.65" stop-color="#D8314B"/>
      <stop offset="1" stop-color="#D8314B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB627" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#C2263F" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5E0A1C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="score" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFBF0"/>
      <stop offset="0.32" stop-color="#FFD35C"/>
      <stop offset="0.64" stop-color="#FFB627" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFB627" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FF8FA6" stroke-width="1" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#sbg)"/>
  <rect width="1280" height="640" fill="url(#sgrid)"/>
  <ellipse cx="640" cy="300" rx="560" ry="380" fill="url(#sglow)"/>

  <g fill="none" stroke="#FFB627" stroke-width="1.6" stroke-opacity="0.5">
    <path d="M42 82V42H82"/>
    <path d="M1238 42H1198V82"/>
    <path d="M42 558V598H82"/>
    <path d="M1238 598H1198V558"/>
  </g>

  <!-- the solar jewel, centred above the name -->
  <g transform="translate(640 152)">
    <path d="M0 -68 L59 -34 L59 34 L0 68 L-59 34 L-59 -34 Z" fill="none" stroke="#FFB627" stroke-opacity="0.50" stroke-width="1.3"/>
    <path d="M0 -32 L28 -16 L28 16 L0 32 L-28 16 L-28 -16 Z" fill="#D8314B" fill-opacity="0.10" stroke="#D8314B" stroke-opacity="0.55" stroke-width="1.1"/>
    <path d="M0 -68 L0 -32 M59 -34 L28 -16 M59 34 L28 16 M0 68 L0 32 M-59 34 L-28 16 M-59 -34 L-28 -16" fill="none" stroke="#D8314B" stroke-opacity="0.5" stroke-width="1"/>
    <g fill="#FFD98A">
      <circle cx="0" cy="-68" r="2.6"/>
      <circle cx="59" cy="-34" r="2.6"/>
      <circle cx="59" cy="34" r="2.6"/>
      <circle cx="0" cy="68" r="2.6"/>
      <circle cx="-59" cy="34" r="2.6"/>
      <circle cx="-59" cy="-34" r="2.6"/>
    </g>
    <circle r="26" fill="url(#score)">
      <animate attributeName="r" values="22;31;22" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#FFFDF6">
      <animate attributeName="r" values="3.2;5;3.2" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g text-anchor="middle" font-family="'Cascadia Mono','SF Mono',Consolas,ui-monospace,monospace">
    <text x="640" y="268" font-size="13" letter-spacing="5.5" fill="#A8879A">// SYNTHETIC MIND · REAL RECEIPTS</text>
    <text x="632" y="416" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="150"
          font-weight="800" letter-spacing="-5" fill="url(#sname)">SENJUWOO</text>
    <text x="640" y="500" font-size="20" fill="#C7A9B4">Skyrim SE/AE · SKSE C++ · agent workbenches · Windows tools</text>
    <text x="640" y="538" font-size="15" fill="#7C6270">native code, typed tools, no hand-waving</text>
  </g>

  <rect x="470" y="448" width="340" height="2" fill="url(#srule)"/>
</svg>
